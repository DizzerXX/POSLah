name: poslah

services:
  postgres:
    image: postgres:16-alpine
    container_name: poslah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-poslah}
      POSTGRES_USER: ${DB_USERNAME:-poslah}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poslah}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first initialisation of an empty data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-poslah} -d ${DB_DATABASE:-poslah}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: poslah-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
