name: CI

# Runs the three suites on every push. The regression that prompted this was a broken test
# file committed in step 3 and only noticed a session later — a green run on the commit
# itself would have caught it immediately.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api:
    name: API (Laravel · PostgreSQL)
    runs-on: ubuntu-latest

    services:
      # Real PostgreSQL, never SQLite. The append-only triggers and the enabled_modules
      # CHECK are database-level guarantees that SQLite cannot express, so a SQLite run
      # would pass against a schema missing the invariants the tests exist to protect.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: poslah_testing
          POSTGRES_USER: poslah
          POSTGRES_PASSWORD: poslah
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U poslah"
          --health-interval=5s --health-timeout=5s --health-retries=10

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath
          coverage: none

      - run: composer install --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Test
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: poslah_testing
          DB_USERNAME: poslah
          DB_PASSWORD: poslah

  till:
    name: Till (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: till

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Drift's generated sources are committed, so this proves they are still in step with
      # the table definitions rather than quietly stale.
      - run: dart run build_runner build
      - run: git diff --exit-code lib/data/local_database.g.dart

      - run: flutter analyze
      - run: flutter test

  backoffice:
    name: Backoffice (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backoffice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - run: npm ci
      - run: npx ng build --configuration development

      # Chrome is present on the runner. The reconciliation spec spent several sessions
      # silently not compiling — written in Jest idiom against a Jasmine runner — because
      # nothing here could launch a browser to find out.
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  pos-web:
    name: Web till (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pos-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pos-web/package-lock.json

      - run: npm ci
      - run: npx ng build --configuration development
      - run: npx ng test --watch=false --browsers=ChromeHeadless
